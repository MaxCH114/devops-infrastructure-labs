apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  labels:
    app: demo-app
    environment: dev
spec:
  containers:
    - name: demo-container
      image: nginx:1.25-alpine
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
