apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-app-deployment
  labels:
    app: spot-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: spot-app
  template:
    metadata:
      labels:
        app: spot-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      # Target only nodes in the mixed nodegroup that use Spot capacity
      nodeSelector:
        eks.amazonaws.com/capacityType: SPOT
